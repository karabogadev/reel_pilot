<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Reel Pilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Text comes from src/core/i18n.ts: data-i18n sets the text, data-i18n-aria the aria-label. -->
    <header>
      <img src="../icons/icon-48.png" width="24" height="24" alt="" />
      <h1>Reel Pilot</h1>
      <div class="lang" role="group" data-i18n-aria="language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </header>

    <label class="row">
      <span class="label"><span data-i18n="autoAdvance"></span><small data-i18n="autoAdvanceHint"></small></span>
      <input type="checkbox" id="autoAdvance" class="switch" />
    </label>

    <label class="row">
      <span class="label"><span data-i18n="loops"></span><small data-i18n="loopsHint"></small></span>
      <select id="loops">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>

    <div class="row column">
      <div class="line">
        <span class="label" data-i18n="speed"></span>
        <output id="speedValue">1x</output>
        <button type="button" id="speedReset">1x</button>
      </div>
      <input type="range" id="speed" min="0.25" max="4" step="0.25" data-i18n-aria="speed" />
    </div>

    <label class="row">
      <span class="label" data-i18n="seekStep"></span>
      <select id="seekStep">
        <option value="2"></option>
        <option value="5"></option>
        <option value="10"></option>
        <option value="15"></option>
      </select>
    </label>

    <div class="row">
      <span class="label"><span data-i18n="breakReminder"></span><small data-i18n="breakReminderHint"></small></span>
      <span class="pair">
        <select id="stopAfterReels" data-i18n-aria="reelCount">
          <option value="0"></option>
          <option value="10"></option>
          <option value="20"></option>
          <option value="30"></option>
          <option value="50"></option>
        </select>
        <select id="stopAfterMinutes" data-i18n-aria="duration">
          <option value="0"></option>
          <option value="5"></option>
          <option value="10"></option>
          <option value="15"></option>
          <option value="30"></option>
          <option value="60"></option>
        </select>
      </span>
    </div>

    <label class="row">
      <span class="label" data-i18n="shortcuts"></span>
      <input type="checkbox" id="shortcuts" class="switch" />
    </label>

    <details class="shortcuts">
      <summary data-i18n="shortcutList"></summary>
      <dl class="keys" id="keys">
        <dt><kbd>←</kbd><kbd>→</kbd></dt>
        <dd data-i18n="keySeek"></dd>
        <dt><kbd>S</kbd><kbd>D</kbd><kbd>R</kbd></dt>
        <dd data-i18n="keySpeed"></dd>
        <dt><kbd>F</kbd></dt>
        <dd data-i18n="keyBoost"></dd>
        <dt><kbd>,</kbd><kbd>.</kbd></dt>
        <dd data-i18n="keyFrame"></dd>
        <dt><kbd>C</kbd></dt>
        <dd data-i18n="keyCopy"></dd>
        <dt><kbd>[</kbd><kbd>]</kbd><kbd>\</kbd></dt>
        <dd data-i18n="keyLoop"></dd>
        <dt><kbd>A</kbd></dt>
        <dd data-i18n="keyAuto"></dd>
        <dt><kbd>K</kbd></dt>
        <dd data-i18n="stayOnReel"></dd>
      </dl>
    </details>

    <footer>
      <button type="button" id="diag" data-i18n="copyDiagnostics"></button>
      <span id="diagStatus" role="status"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
